[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachepilot"
version = "0.1.0"
description = "Transport-agnostic fresh, stale, and error cache decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Ali" }]
keywords = ["cache", "http", "freshness", "stale-while-revalidate", "resilience"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/faizanali2k05/cachepilot"
Repository = "https://github.com/faizanali2k05/cachepilot"
Issues = "https://github.com/faizanali2k05/cachepilot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cachepilot"]
